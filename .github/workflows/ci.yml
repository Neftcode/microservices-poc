# =============================================================================
# Pipeline de Integración Continua (CI) - Sistema de Facturación Electrónica
# =============================================================================
# Se ejecuta automáticamente en cada push o pull request a las ramas:
#   - dev   → entorno de desarrollo (rama base)
#   - uat   → entorno de pruebas/staging
#   - prd   → entorno de producción
#
# Herramientas: GitHub Actions
# Servicios cubiertos: orchestrator (Java), pdf-service (Python),
#                      notification-service (Node.js), frontend (React)
# =============================================================================

name: CI Pipeline

on:
  push:
    branches:
      - dev
      - uat
      - prd
  pull_request:
    branches:
      - dev
      - uat
      - prd

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Compilar y testear el Orquestador Service (Java 21 + Spring Boot 3)
  # ---------------------------------------------------------------------------
  test-orchestrator:
    name: "Test Orchestrator Service (Java)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Ejecutar pruebas unitarias e integración
        run: mvn test --no-transfer-progress
        working-directory: orchestrator-service

      - name: Compilar JAR (sin pruebas, ya ejecutadas)
        run: mvn package -DskipTests --no-transfer-progress
        working-directory: orchestrator-service

      - name: Subir artefacto JAR
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-jar
          path: orchestrator-service/target/*.jar
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Testear el PDF Service (Python 3.11 + FastAPI)
  # ---------------------------------------------------------------------------
  test-pdf-service:
    name: "Test PDF Service (Python)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pdf-service/requirements.txt"

      - name: Instalar dependencias de producción
        run: pip install -r requirements.txt
        working-directory: pdf-service

      - name: Instalar dependencias de testing
        run: pip install -r requirements-test.txt
        working-directory: pdf-service

      - name: Ejecutar pruebas con pytest
        run: pytest tests/ -v --tb=short
        working-directory: pdf-service

  # ---------------------------------------------------------------------------
  # Job 3: Testear el Notification Service (Node.js 20 + Express)
  # ---------------------------------------------------------------------------
  test-notification-service:
    name: "Test Notification Service (Node.js)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: notification-service/package-lock.json

      - name: Instalar dependencias (incluyendo devDependencies para Jest)
        run: npm install
        working-directory: notification-service

      - name: Ejecutar pruebas con Jest
        run: npm test
        working-directory: notification-service

  # ---------------------------------------------------------------------------
  # Job 4: Build del Frontend (React 18 + Vite)
  # ---------------------------------------------------------------------------
  build-frontend:
    name: "Build Frontend (React + Vite)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Compilar build de producción
        run: npm run build
        working-directory: frontend

      - name: Subir artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 5: Resumen de CI (solo si todos los anteriores pasan)
  # ---------------------------------------------------------------------------
  ci-summary:
    name: "CI Summary"
    runs-on: ubuntu-latest
    needs:
      - test-orchestrator
      - test-pdf-service
      - test-notification-service
      - build-frontend

    steps:
      - name: Resumen del pipeline CI
        run: |
          echo "=============================================="
          echo "  CI Pipeline completado exitosamente"
          echo "=============================================="
          echo "  Rama   : ${{ github.ref_name }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "  Evento : ${{ github.event_name }}"
          echo "=============================================="
          echo "  Servicios validados:"
          echo "    ✅  Orchestrator Service (Java)"
          echo "    ✅  PDF Service (Python)"
          echo "    ✅  Notification Service (Node.js)"
          echo "    ✅  Frontend (React + Vite)"
          echo "=============================================="
