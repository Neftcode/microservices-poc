# =============================================================================
# Pipeline de Integración Continua (CI) - Sistema de Facturación Electrónica
# =============================================================================
# Se ejecuta automáticamente en cada push o pull request a las ramas:
#   - dev   → entorno de desarrollo (rama base)
#   - uat   → entorno de pruebas/staging
#   - prd   → entorno de producción
#
# Herramientas: GitHub Actions
# Servicios cubiertos: orchestrator (Java), pdf-service (Python),
#                      notification-service (Node.js), frontend (React)
# =============================================================================

name: CI Pipeline

on:
  push:
    branches:
      - dev
      - uat
      - prd
  pull_request:
    branches:
      - dev
      - uat
      - prd

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Compilar y testear el Orquestador Service (Java 21 + Spring Boot 3)
  # ---------------------------------------------------------------------------
  test-orchestrator:
    name: "Test Orchestrator Service (Java)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

     # -------------------------------------------------
      # 3️⃣ Instalación de dependencias
      # -------------------------------------------------
      - name: Instalación de dependencias
        run: |
          mvn dependency:go-offline --no-transfer-progress 2>&1 | tee 01-install-java.log
        working-directory: orchestrator-service
      
      # -------------------------------------------------
      # 4️⃣ Validación del proyecto
      # -------------------------------------------------
      - name: Validar proyecto
        run: |
          mvn validate --no-transfer-progress 2>&1 | tee 02-validate-java.log
        working-directory: orchestrator-service
      
      # -------------------------------------------------
      # 5️⃣ Compilación
      # -------------------------------------------------
      - name: Compilar código
        run: |
          mvn compile --no-transfer-progress 2>&1 | tee 03-compile-java.log
        working-directory: orchestrator-service
      
      # -------------------------------------------------
      # 6️⃣ Ejecutar pruebas
      # -------------------------------------------------
      - name: Ejecutar pruebas unitarias e integración
        run: |
          mvn test --no-transfer-progress 2>&1 | tee 04-test-java.log
        working-directory: orchestrator-service
      
      # -------------------------------------------------
      # 7️⃣ Empaquetado
      # -------------------------------------------------
      - name: Empaquetar aplicación
        run: |
          mvn package -DskipTests --no-transfer-progress 2>&1 | tee 05-package-java.log
        working-directory: orchestrator-service
      
      # -------------------------------------------------
      # 8️⃣ Subir artefactos
      # -------------------------------------------------
      - name: Subir artefacto JAR y logs
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-build-${{ github.run_number }}
          path: |
            orchestrator-service/target/*.jar
            orchestrator-service/*.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Testear el PDF Service (Python 3.11 + FastAPI)
  # ---------------------------------------------------------------------------
  test-pdf-service:
    name: "Test PDF Service (Python)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pdf-service/requirements.txt"

      - name: Instalar dependencias 
        run: |
          pip install -r requirements.txt 2>&1 | tee install-py.log
        working-directory: pdf-service

      - name: Instalar dependencias de testing
        run: |
          pip install -r requirements-test.txt 2>&1 | tee install-test-py.log
        working-directory: pdf-service

      - name: Ejecutar pruebas con pytest
        run: |
          pytest tests/ -v --tb=short 2>&1 | tee test-py.log
        working-directory: pdf-service

      # -----------------------------
      # Subir logs como artefacto
      # -----------------------------
      - name: Subir logs
        uses: actions/upload-artifact@v4
        with:
          name: pdf-service-logs-${{ github.run_number }}
          path: pdf-service/*.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3: Testear el Notification Service (Node.js 20 + Express)
  # ---------------------------------------------------------------------------
  test-notification-service:
    name: "Test Notification Service (Node.js)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: notification-service/package-lock.json

      # -------------------------------------------------
      # 1️⃣ Instalación de dependencias
      # -------------------------------------------------
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt 2>&1 | tee 01-install-py.log
        working-directory: pdf-service
      
      - name: Instalar dependencias de testing
        run: |
          pip install -r requirements-test.txt 2>&1 | tee 02-install-test-py.log
        working-directory: pdf-service
      
      # -------------------------------------------------
      # 2️⃣ Validación de código (Lint)
      # -------------------------------------------------
      - name: Instalar herramienta de lint (ruff)
        run: |
          pip install ruff 2>&1 | tee 03-install-lint-py.log
        working-directory: pdf-service
      
      - name: Validar código con ruff
        run: |
          ruff check . 2>&1 | tee 04-lint-py.log
        working-directory: pdf-service
      
      # -------------------------------------------------
      # 3️⃣ Ejecutar pruebas
      # -------------------------------------------------
      - name: Ejecutar pruebas con pytest
        run: |
          pytest tests/ -v --tb=short 2>&1 | tee 05-test-py.log
        working-directory: pdf-service
      
      # -------------------------------------------------
      # 4️⃣ Subir logs como artefacto
      # -------------------------------------------------
      - name: Subir logs Python
        uses: actions/upload-artifact@v4
        with:
          name: pdf-service-build-${{ github.run_number }}
          path: pdf-service/*.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4: Build del Frontend (React 18 + Vite)
  # ---------------------------------------------------------------------------
  build-frontend:
    name: "Build Frontend (React + Vite)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # -------------------------------------------------
      # 1️⃣ Instalación de dependencias
      # -------------------------------------------------
      - name: Instalar dependencias
        run: |
          npm ci 2>&1 | tee 01-install-nd.log
        working-directory: frontend
      
      # -------------------------------------------------
      # 2️⃣ Validación de código (Lint)
      # -------------------------------------------------
      - name: Validar código con ESLint
        run: |
          npm run lint 2>&1 | tee 02-lint-nd.log
        working-directory: frontend
        continue-on-error: false
      
      # -------------------------------------------------
      # 3️⃣ Ejecutar pruebas
      # -------------------------------------------------
      - name: Ejecutar pruebas
        run: |
          npm test -- --watchAll=false 2>&1 | tee 03-test-nd.log
        working-directory: frontend
      
      # -------------------------------------------------
      # 4️⃣ Build de producción
      # -------------------------------------------------
      - name: Compilar build de producción
        run: |
          npm run build 2>&1 | tee 04-build-nd.log
        working-directory: frontend
      
      # -------------------------------------------------
      # 5️⃣ Subir artefactos (build + logs)
      # -------------------------------------------------
      - name: Subir artefacto del build y logs
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.run_number }}
          path: |
            frontend/dist/
            frontend/*.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 5: Resumen de CI (solo si todos los anteriores pasan)
  # ---------------------------------------------------------------------------
  ci-summary:
    name: "CI Summary"
    runs-on: ubuntu-latest
    needs:
      - test-orchestrator
      - test-pdf-service
      - test-notification-service
      - build-frontend

    steps:
      - name: Resumen del pipeline CI
        run: |
          echo "=============================================="
          echo "  CI Pipeline completado exitosamente"
          echo "=============================================="
          echo "  Rama   : ${{ github.ref_name }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "  Evento : ${{ github.event_name }}"
          echo "=============================================="
          echo "  Servicios validados:"
          echo "    ✅  Orchestrator Service (Java)"
          echo "    ✅  PDF Service (Python)"
          echo "    ✅  Notification Service (Node.js)"
          echo "    ✅  Frontend (React + Vite)"
          echo "=============================================="

  # ---------------------------------------------------------------------------
  # Job 6: Aprobación manual para despliegue a UAT
  # ---------------------------------------------------------------------------
  # Requiere configurar el environment "uat" en GitHub:
  #   Settings > Environments > New environment > "uat"
  #   → Marcar "Required reviewers" y agregar los aprobadores
  # ---------------------------------------------------------------------------
  approve-uat:
    name: "Aprobación para UAT"
    runs-on: ubuntu-latest
    needs: ci-summary
    if: github.ref == 'refs/heads/uat' && github.event_name == 'push'
    environment: uat

    steps:
      - name: Aprobado para UAT
        run: |
          echo "=============================================="
          echo "  Despliegue a UAT aprobado"
          echo "=============================================="
          echo "  Rama   : ${{ github.ref_name }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "=============================================="

  # ---------------------------------------------------------------------------
  # Job 7: Aprobación manual para despliegue a Producción
  # ---------------------------------------------------------------------------
  # Requiere configurar el environment "prd" en GitHub:
  #   Settings > Environments > New environment > "prd"
  #   → Marcar "Required reviewers" y agregar los aprobadores
  # ---------------------------------------------------------------------------
  approve-prd:
    name: "Aprobación para Producción"
    runs-on: ubuntu-latest
    needs: ci-summary
    if: github.ref == 'refs/heads/prd' && github.event_name == 'push'
    environment: prd

    steps:
      - name: Aprobado para Producción
        run: |
          echo "=============================================="
          echo "  Despliegue a PRODUCCIÓN aprobado"
          echo "=============================================="
          echo "  Rama   : ${{ github.ref_name }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "=============================================="
